<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>解答ページ｜{{名前}}</title>
<style>
  body { font-family: "Yu Gothic UI", "Meiryo", sans-serif; background: #f6f7f9; color: #1f2328; margin: 0; line-height: 1.8; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .meta { color: #5b636d; margin: 0 0 24px; }
  section { background: #fff; border: 1px solid #dfe2e6; border-radius: 12px; padding: 18px 20px; margin: 0 0 16px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  .answer { font-size: 1.6rem; font-weight: bold; color: #1a5fb4; }
  details summary { cursor: pointer; color: #1a5fb4; }
  .done { text-align: center; font-weight: bold; color: #1d7a3e; }
</style>
</head>
<body>
<div class="wrap">
  <h1>合言葉を探せ：解答ページ</h1>
  <p class="meta">{{名前}} ／ 使ったAI：{{使ったAI}}</p>

  <section>
    <h2>見つけた合言葉</h2>
    <p class="answer">{{合言葉}}</p>
  </section>

  <section>
    <h2>どうやって解いたか</h2>
    <ul>
      <li>ヒント1：{{ヒント1の解き方}}</li>
      <li>ヒント2：{{ヒント2の解き方}}</li>
      <li>ヒント3：{{ヒント3の解き方}}</li>
    </ul>
  </section>

  <section>
    <h2>自作なぞなぞ</h2>
    <p>{{なぞなぞの問題}}</p>
    <details>
      <summary>答えを見る</summary>
      <p>{{なぞなぞの答え}}</p>
    </details>
  </section>

  <section>
    <p class="done">push完了です</p>
  </section>
</div>
</body>
</html>
